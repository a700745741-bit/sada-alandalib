<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>صدى العندليب | فرز التوقعات</title>

<style>
:root{--navy:#0b2e59;--green:#25D366;--bg:#f4f7f6}
*{box-sizing:border-box}
body{font-family:Tahoma,Arial,sans-serif;background:var(--bg);margin:0;padding:10px;color:#17212b}
.header{background:var(--navy);color:#fff;padding:15px;border-radius:0 0 14px 14px;text-align:center}
.card{background:#fff;border-radius:12px;padding:12px;margin:10px 0;box-shadow:0 2px 5px #0001;border-top:4px solid var(--navy)}
.card.green{border-color:var(--green)}
.card.gold{border-color:#e5a900}
label{font-weight:bold;display:block;margin:7px 0}
textarea,input,select{width:100%;padding:11px;border:2px solid #ccc;border-radius:9px;font:14px Tahoma,Arial}
textarea{resize:vertical;line-height:1.6}
button{border:0;padding:12px;border-radius:9px;font-weight:bold;color:white;background:var(--navy);cursor:pointer;font-size:15px;margin:5px 0;width:100%}
button.green{background:#168747}
button.light{background:#526579}
button.gold{background:#c58b00}
.badges{display:flex;gap:5px;flex-wrap:wrap}
.badge{padding:6px 10px;border-radius:20px;background:#edf1f7;font-size:12px}
.help{background:#fff3cd;border:1px solid #ffc107;border-radius:8px;padding:9px;font-size:12px;line-height:1.7}
#status{padding:10px;background:#eef3ff;border-radius:8px;margin-top:8px;font-size:13px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px;min-width:560px}
th{background:var(--navy);color:white;padding:8px}
td{border:1px solid #ddd;padding:7px;vertical-align:top}
td.center{text-align:center}
.result-group{border:1px solid #dce4eb;border-radius:9px;margin:9px 0;overflow:hidden}
.result-group h4{margin:0;background:#eaf1f8;padding:10px;color:var(--navy)}
.result-group p{padding:0 10px;line-height:1.8}
#preview{white-space:pre-wrap;word-break:break-word;background:#f7f9fc;border:1px solid #ddd;border-radius:8px;padding:10px;max-height:280px;overflow:auto;font-size:13px}

/* ⭐ تنسيق نجوم مباريات اليوم */
.star-banner{
background:linear-gradient(135deg,#0b2e59,#1764a5);
color:white;
border-radius:11px;
padding:15px;
text-align:center;
margin:10px 0;
}
.star-banner h3{margin:0 0 8px;font-size:21px}
.star-banner p{margin:4px 0;font-size:13px}
.star-table{
width:100%;
min-width:0;
border-collapse:collapse;
margin-top:12px;
}
.star-table th{
background:#c58b00;
color:white;
padding:11px 5px;
}
.star-table td{
padding:11px 5px;
text-align:center;
border:1px solid #e8dfc5;
}
.star-table tr:nth-child(even){background:#fff9e9}
.star-rank{font-size:17px;font-weight:bold;color:#c58b00}
.star-name{font-weight:bold;color:#0b2e59}
.star-hits{font-weight:bold;color:#168747}
.star-empty{
background:#fff8e6;
padding:15px;
border-radius:9px;
text-align:center;
line-height:1.9;
}

@media(min-width:760px){
body{max-width:1000px;margin:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
}
</style>
</head>

<body>

<div class="header">
<h2>🔥 صدى العندليب</h2>
<p>فرز عام للتوقعات — رسائل متلاصقة — نتائج كاملة أو مباريات لم تُلعب بعد</p>
</div>

<div class="two">

<section class="card">
<label>📋 القسم الأول: الصق رسائل توقعات المشاركين</label>
<textarea id="allBox" rows
